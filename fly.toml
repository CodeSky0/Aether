# @aether/converge-server · Fly.io 部署配置
# 文档：https://fly.io/docs/reference/configuration/
app = 'aether-converge'
primary_region = 'nrt'  # 东京（靠近中国）

[build]
  dockerfile = 'apps/@aether/converge-server/Dockerfile'

[env]
  PORT = '1234'
  NODE_ENV = 'production'

[http_service]
  internal_port = 1234
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
